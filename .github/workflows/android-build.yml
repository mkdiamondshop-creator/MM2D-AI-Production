name: MM2D Android APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build MM2D Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Typecheck and Lint
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Verify MM2D Launcher Icon Assets
        run: |
          echo "Verifying MM2D launcher icons..."
          test -f public/mm2d_logo.png || (echo "Missing public/mm2d_logo.png" && exit 1)
          test -f public/icon-192.png || (echo "Missing public/icon-192.png" && exit 1)
          test -f public/icon-512.png || (echo "Missing public/icon-512.png" && exit 1)
          test -f public/manifest.json || (echo "Missing public/manifest.json" && exit 1)
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || (echo "Missing mipmap icon" && exit 1)
          echo "MM2D Launcher Icons verified successfully!"

      - name: Verify Splash Background and Animation Assets
        run: |
          echo "Verifying splash assets..."
          test -f public/mm2d_splash.png || (echo "Missing public/mm2d_splash.png" && exit 1)
          test -f src/assets/mm2d_splash.png || (echo "Missing src/assets/mm2d_splash.png" && exit 1)
          test -f src/components/SplashScreen.tsx || (echo "Missing SplashScreen.tsx" && exit 1)
          echo "MM2D Splash Assets verified successfully!"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare Android Web Assets
        run: |
          echo "Syncing production web build into Android app assets..."
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
          echo "Web assets synced into Android project."

      - name: Build Android Release APK
        working-directory: android
        run: |
          echo "Building MM2D Android Release APK with Gradle..."
          gradle assembleRelease --stacktrace

      - name: Verify and Stage APK Output
        run: |
          echo "Locating built APK..."
          mkdir -p release-apk
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No .apk file was generated!"
            exit 1
          fi
          echo "Generated APK: $APK_FILE"
          case "$APK_FILE" in
            *.apk) echo "Confirmed valid .apk extension" ;;
            *) echo "ERROR: File does not have .apk extension" && exit 1 ;;
          esac
          cp "$APK_FILE" release-apk/mm2d-release-unsigned.apk
          ls -lh release-apk/

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: mm2d-android-release
          path: release-apk/*.apk
          if-no-files-found: error
